# Model: Gemma-4-E4B-it (2026; sliding window 512 + full layers, KV sharing,
# per-layer embeddings, final-logit softcap 30; text path of the multimodal checkpoint).
# transformers >= 5 venv; budgets ≈ 0.65 × the 7B budgets (4.6B matmul parameters).
# T_max = 4096: at 1536 tokens, 59–98% of the Qwen3.5-2B / Gemma-4 AIME and AMC samples were cut before an answer.
# Budgets = per-token compute × the 7B budget × 4096/1536, i.e. the same number of complete samples per budget.
MODEL_NAME="google/gemma-4-E4B-it"
VENV_PATH="${TF5_VENV_PATH:-$SCRATCH/venvs/arr_tf5}"
ARR_THINKING="off"
ARR_MAX_INPUT_TOKENS=5120
ARR_MAX_NEW_TOKENS=4096
ARR_BUDGETS="350,700,1400"
ARR_SAMPLER="batched"
