# Wall-clock timing on an exclusive GPU: one (question, method, budget) solve at a time,
# so the measured latency of a solve is not shared with other questions or experiments.
ARR_METHODS="arr,replace_ordinary,replace_pld,maj,conma"
ARR_BUDGETS="400"
ARR_MAX_SAMPLES=40
ARR_MAX_ACTIVE_QUESTIONS=1
ARR_OUTPUT_ROOT="${ARR_OUTPUT_ROOT%/}_timing"
