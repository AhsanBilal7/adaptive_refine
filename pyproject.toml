[project]
name = "adaptive-replay-refinement"
version = "0.1.0"
description = "Adaptive Replay Refinement (ARR): training-free test-time compute allocation by fixed-point detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=4.57",
    "accelerate>=1.0",
    "datasets>=3.0",
    "numpy>=1.26",
    "sympy>=1.13",
    "antlr4-python3-runtime==4.13.2",
    "pyparsing>=3.1",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.8", "pillow>=10.0"]

[tool.uv]
package = false
